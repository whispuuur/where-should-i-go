<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1200" viewBox="0 0 400 1200">
  <defs>
    <linearGradient id="photo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d3228;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#2e2620;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1f1c1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161412;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C95A3D;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#C95A3D;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#C95A3D;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#C95A3D;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#C95A3D;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="400" height="1200" fill="url(#photo)"/>
  <rect width="400" height="1200" fill="url(#warm)"/>
  <rect width="400" height="1200" fill="url(#glow)"/>
</svg>
